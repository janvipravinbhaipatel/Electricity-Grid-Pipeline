name: Daily pipeline

on:
  schedule:
    - cron: "0 13 * * *"     # every day at 13:00 UTC = 9:00 a.m. in Toronto (summer time)
  workflow_dispatch:          # adds a "Run workflow" button on GitHub
  push:
    branches: [main]          # also runs on every push, as a test

permissions:
  contents: write             # lets the workflow commit the refreshed data

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir --force-reinstall dbt-core==1.10.19 dbt-duckdb==1.10.1
          python -m pip show dbt-core dbt-duckdb
          python -m pip check

      - name: Download history
        run: python backfill.py

          - name: Clear stale dbt artifacts
        run: |
          rm -rf dbt/target dbt/logs

      - name: Run the pipeline (ingest, load, dbt build, export)
        run: python run_pipeline.py

      - name: Commit refreshed dashboard data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add dashboard/fct_hourly.parquet
          git diff --staged --quiet || git commit -m "Refresh dashboard data"
          git push
name: Daily pipeline

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download history
        run: python backfill.py

      - name: Run the pipeline
        run: python run_pipeline.py

      - name: Commit refreshed dashboard data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add dashboard/*.parquet
          git diff --staged --quiet || git commit -m "Refresh dashboard data"
          git push